name = "open-wegram-bot"
main = "src/worker.js"
compatibility_date = "2023-05-18"
keep_vars = true

[placement]
mode = "smart"

# Create a KV namespace first, then fill in the real IDs:
#   npx wrangler kv namespace create STATE_KV
#   npx wrangler kv namespace create STATE_KV --preview
[[kv_namespaces]]
binding = "STATE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"
